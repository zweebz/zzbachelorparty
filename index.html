<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZZ Bachelor Cup 2026 - MSG Arena Tracker</title>

<!-- ✅ FIX: Proper Tailwind Load -->
https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; background:#060b19; }
.font-arena { font-family:'Bungee', cursive; }
.knicks-orange { color:#F58426; }
.knicks-blue { color:#006BB6; }
.bg-knicks-blue { background:#006BB6; }
.border-knicks-blue { border-color:#006BB6; }
</style>
</head>

<body class="text-gray-100 min-h-screen flex flex-col">

<header class="bg-black py-8 border-b-8 border-orange-500 text-center">
<h1 class="font-arena text-4xl sm:text-6xl">ZZ BACHELOR <span class="knicks-orange">CUP</span></h1>
</header>

<main class="max-w-7xl mx-auto w-full px-4 mt-6 grid lg:grid-cols-3 gap-6">
<!-- LEFT -->
<div class="lg:col-span-2">
<nav class="flex gap-2 bg-slate-900 p-2 rounded-xl">
<button class="tab-btn bg-knicks-blue px-4 py-2 rounded" data-tab="teams">Teams</button>
<button class="tab-btn text-gray-400" data-tab="events">Events</button>
</nav>

<section id="teams" class="tab-pane mt-4">
<div id="rosters-grid" class="grid md:grid-cols-2 gap-4"></div>
</section>

<section id="events" class="tab-pane hidden mt-4">
<div class="grid md:grid-cols-3 gap-4">
<div>
<h3 class="text-xs text-gray-400">Semifinal</h3>
<select id="sf1-t1"></select>
<input id="sf1-s1" type="number" value="0">
<select id="sf1-t2"></select>
<input id="sf1-s2" type="number" value="0">
</div>

<div>
<h3 class="text-xs text-gray-400">Final</h3>
<span id="finals-t1">TBD</span>
<input id="finals-s1" type="number" value="0">
<span id="finals-t2">TBD</span>
<input id="finals-s2" type="number" value="0">
</div>

<div>
<h3 class="text-xs text-gray-400">3rd</h3>
<span id="third-t1">TBD</span>
<span id="third-t2">TBD</span>
</div>

</div>

<button id="save" class="bg-knicks-blue mt-4 px-4 py-2 rounded">Save</button>
</section>

</div>

<!-- RIGHT -->
<aside class="bg-black border-4 border-knicks-blue p-4 rounded-xl sticky top-4 h-fit">
<h3 class="font-arena text-xl mb-4">Standings</h3>
<div id="leaderboard"></div>
</aside>

</main>

<script type="module">

/* ✅ IMPORT YOUR REAL MODULES */
import './js/constants.js';
import './js/firebase/sync.js';
import './js/ui/tabs.js';
import './js/ui/notifications.js';
import './js/ui/accessibility.js';
import './js/utils/dom.js';
import './js/utils/validation.js';
/* ✅ LOCAL STATE */
const teams=["OGs","Harts","Brunsons","KATs"];
const state={scores:{},results:{}};


/* ✅ RENDER TEAMS */
const grid=document.getElementById("rosters-grid");
teams.forEach(t=>{
let d=document.createElement("div");
d.className="p-4 bg-slate-900 rounded";
d.textContent=t;
grid.appendChild(d);
});
/* ✅ POPULATE SELECTS */
function fillSelect(id){
let el=document.getElementById(id);
teams.forEach(t=>{
let o=document.createElement("option");
o.value=t;o.textContent=t;
el.appendChild(o);
});
}

fillSelect("sf1-t1");
fillSelect("sf1-t2");
/* ✅ SCORING ENGINE */
function calculate(){
let scores={};
teams.forEach(t=>scores[t]=0);
let t1=document.getElementById("sf1-t1").value;
let t2=document.getElementById("sf1-t2").value;
let s1=parseInt(document.getElementById("sf1-s1").value)||0;
let s2=parseInt(document.getElementById("sf1-s2").value)||0;
let winner=null, loser=null;


if(s1>s2){winner=t1; loser=t2}
else if(s2>s1){winner=t2; loser=t1}


if(winner){
scores[winner]+=4;
document.getElementById("finals-t1").textContent=winner;
document.getElementById("third-t1").textContent=loser;
}

render(scores);
}

/* ✅ RENDER LEADERBOARD */
function render(scores){
let el=document.getElementById("leaderboard");
el.innerHTML="";
Object.entries(scores)
.sort((a,b)=>b[1]-a[1])
.forEach(([team,score])=>{
let row=document.createElement("div");
row.className="flex justify-between text-sm border-b border-white/10 py-1";
row.innerHTML=`<span>${team}</span><span>${score}</span>`;
el.appendChild(row);
});
}
/* ✅ BIND */
document.getElementById("save").addEventListener("click", calculate);


/* ✅ TABS */
document.querySelectorAll(".tab-btn").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".tab-pane").forEach(p=>p.classList.add("hidden"));
document.getElementById(btn.dataset.tab).classList.remove("hidden");
};
});
</script>

</body>
