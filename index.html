<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZZ Bachelor Cup 2026</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style>
body { background:#060b19; color:white; font-family:Inter,sans-serif; }
.btn { @apply bg-slate-800 px-2 py-1 rounded text-xs; }
.winner { background:rgba(34,197,94,.2); opacity:1 !important; }
.loser { opacity:.4; }
</style>
</head>

<body class="p-6">

<h1 class="text-3xl mb-4 font-bold">ZZ Bachelor Cup 2026</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

<!-- BRACKET -->
<div class="bg-black p-4 rounded-xl space-y-4">

<h2 class="text-lg font-bold">Bracket</h2>

<div>
<h3>Semifinal 1</h3>
<select id="sf1-t1"></select>
<input id="sf1-s1" type="number" value="0">
<select id="sf1-t2"></select>
<input id="sf1-s2" type="number" value="0">
</div>

<div>
<h3>Semifinal 2</h3>
<select id="sf2-t1"></select>
<input id="sf2-s1" type="number" value="0">
<select id="sf2-t2"></select>
<input id="sf2-s2" type="number" value="0">
</div>

<div>
<h3>Final</h3>
<span id="final-t1"></span>
<input id="final-s1" type="number" value="0">
<span id="final-t2"></span>
<input id="final-s2" type="number" value="0">
</div>

<div class="flex gap-2">
<button onclick="saveEvent()" class="btn">💾 Save</button>
<button onclick="undo()" class="btn">↩ Undo</button>
</div>

</div>

<!-- STANDINGS -->
<div class="bg-black p-4 rounded-xl">
<h2 class="text-lg font-bold mb-2">Standings</h2>
<div id="standings"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "YOUR_KEY",
 authDomain: "zzbachelorcup.firebaseapp.com",
 projectId: "zzbachelorcup"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const teams = ["The OGs","The Harts","The Brunsons","The KATs"];

let state = {
 matches:{
  sf1:{t1:"The OGs",t2:"The KATs",s1:0,s2:0},
  sf2:{t1:"The Harts",t2:"The Brunsons",s1:0,s2:0},
  final:{t1:"TBD",t2:"TBD",s1:0,s2:0}
 },
 rankings:[],
 completed:false
};

let previousState = null;

/* -------------------------
   DOM CACHE
--------------------------*/
const el = {
 sf1t1:document.getElementById("sf1-t1"),
 sf1t2:document.getElementById("sf1-t2"),
 sf2t1:document.getElementById("sf2-t1"),
 sf2t2:document.getElementById("sf2-t2"),

 sf1s1:document.getElementById("sf1-s1"),
 sf1s2:document.getElementById("sf1-s2"),
 sf2s1:document.getElementById("sf2-s1"),
 sf2s2:document.getElementById("sf2-s2"),

 finals1:document.getElementById("final-t1"),
 finals2:document.getElementById("final-t2"),

 fs1:document.getElementById("final-s1"),
 fs2:document.getElementById("final-s2"),

 standings:document.getElementById("standings")
};

/* -------------------------
   INIT
--------------------------*/
teams.forEach(t=>{
 el.sf1t1.innerHTML+=`<option>${t}</option>`;
 el.sf1t2.innerHTML+=`<option>${t}</option>`;
 el.sf2t1.innerHTML+=`<option>${t}</option>`;
 el.sf2t2.innerHTML+=`<option>${t}</option>`;
});

/* -------------------------
   STATE FLOW
--------------------------*/

function snapshot() {
 previousState = JSON.stringify(state);
}

function undo() {
 if(previousState){
  state = JSON.parse(previousState);
  render();
  saveDebounced();
 }
}

/* -------------------------
   MATCH CALC
--------------------------*/
function updateStateFromInputs(){
 snapshot();

 state.matches.sf1.t1 = el.sf1t1.value;
 state.matches.sf1.t2 = el.sf1t2.value;
 state.matches.sf2.t1 = el.sf2t1.value;
 state.matches.sf2.t2 = el.sf2t2.value;

 state.matches.sf1.s1 = +el.sf1s1.value;
 state.matches.sf1.s2 = +el.sf1s2.value;
 state.matches.sf2.s1 = +el.sf2s1.value;
 state.matches.sf2.s2 = +el.sf2s2.value;

 const sf1 = state.matches.sf1;
 const sf2 = state.matches.sf2;

 if (sf1.s1 !== sf1.s2)
  state.matches.final.t1 = sf1.s1 > sf1.s2 ? sf1.t1 : sf1.t2;

 if (sf2.s1 !== sf2.s2)
  state.matches.final.t2 = sf2.s1 > sf2.s2 ? sf2.t1 : sf2.t2;

 render();
 saveDebounced();
}

/* -------------------------
   SAVE (DEBOUNCED)
--------------------------*/
let saveTimer;
function saveDebounced(){
 clearTimeout(saveTimer);
 saveTimer = setTimeout(async()=>{
  await setDoc(doc(db,"state","event"),state);
 },300);
}

/* -------------------------
   RENDER
--------------------------*/
function render(){
 el.finals1.innerText = state.matches.final.t1;
 el.finals2.innerText = state.matches.final.t2;

 calculateStandings();
}

/* -------------------------
   STANDINGS
--------------------------*/
function calculateStandings(){

 let pts = {};
 teams.forEach(t=>pts[t]=0);

 const f = state.matches.final;

 if(f.s1 === f.s2) return; // prevent tie

 const winner = f.s1 > f.s2 ? f.t1 : f.t2;
 const loser  = f.s1 > f.s2 ? f.t2 : f.t1;

 pts[winner]+=4;
 pts[loser]+=3;

 el.standings.innerHTML = teams
  .sort((a,b)=>pts[b]-pts[a])
  .map(t=>`<div class="flex justify-between">
    <span>${t}</span>
    <span>${pts[t]}</span>
  </div>`).join("");
}

/* -------------------------
   LOCK EVENT
--------------------------*/
function saveEvent(){

 if(!confirm("Lock event permanently?")) return;

 const f = state.matches.final;

 if(f.s1 === f.s2){
  alert("No ties allowed");
  return;
 }

 state.completed = true;
 saveDebounced();
 alert("Event locked");
}

/* -------------------------
   FIREBASE SYNC
--------------------------*/
onSnapshot(doc(db,"state","event"),snap=>{
 if(snap.exists()){
  state = snap.data();
  render();
 }
});

/* -------------------------
   LISTENERS
--------------------------*/
[
 el.sf1t1, el.sf1t2,
 el.sf2t1, el.sf2t2,
 el.sf1s1, el.sf1s2,
 el.sf2s1, el.sf2s2,
 el.fs1, el.fs2
].forEach(i => i.addEventListener("change", updateStateFromInputs));

window.undo = undo;
window.saveEvent = saveEvent;

</script>

</body>
</html>
``
